<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Upload Images to GitHub</title>
</head>
<body>
  <h2>Upload Multiple Images</h2>
  <input type="file" id="fileInput" multiple />
  <br><br>
  <button onclick="uploadImages()">Upload</button>

  <p id="status"></p>

  <script>
    async function uploadImages() {
      const input = document.getElementById("fileInput");
      const files = Array.from(input.files);
      if (!files.length) {
        alert("Please select at least one image.");
        return;
      }

      const status = document.getElementById("status");
      status.innerText = "Encoding images...";

      const base64Images = await Promise.all(files.map(file => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const base64 = reader.result.split(',')[1]; // Remove data URI prefix
            resolve(base64);
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }));

      status.innerText = "Sending to GitHub...";

      const res = await fetch('https://api.github.com/repos/YOUR_USERNAME/YOUR_REPO/dispatches', {
        method: 'POST',
        headers: {
          'Authorization': 'token YOUR_PERSONAL_ACCESS_TOKEN',
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          event_type: "upload-images",
          client_payload: { images: base64Images }
        })
      });

      if (res.ok) {
        status.innerText = "✅ Images sent! Wait a few seconds for the GitHub Action to upload.";
      } else {
        const err = await res.text();
        status.innerText = "❌ Upload failed: " + err;
      }
    }
  </script>
</body>
</html>
